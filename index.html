<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle financeiro familiar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --ink:#1E2A2D; --muted:#5F6F73; --line:#D8E0DD;
  --accent:#0F766E; --accent-ink:#FFFFFF; --neg:#B4432F; --sand:#E9E2D0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10191B; --card:#18252827; --card:#182528; --ink:#E7EEEC; --muted:#93A5A8; --line:#2A3C40;
    --accent:#2BB5A8; --accent-ink:#06201D; --neg:#E8806B; --sand:#2A3A3C;
  }
}
:root[data-theme="dark"]{
  --bg:#10191B; --card:#182528; --ink:#E7EEEC; --muted:#93A5A8; --line:#2A3C40;
  --accent:#2BB5A8; --accent-ink:#06201D; --neg:#E8806B; --sand:#2A3A3C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.1rem;font-weight:600;margin:0 0 14px;color:var(--muted)}
h2{font-size:1rem;font-weight:600;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.saldo{padding:24px 18px}
.saldo .label{color:var(--muted);font-size:.9rem}
.saldo .valor{font-size:clamp(2.4rem,11vw,4rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:4px 0 14px}
.valor.neg{color:var(--neg)}
.barra{height:10px;background:var(--sand);border-radius:6px;overflow:hidden}
.barra>div{height:100%;background:var(--accent);width:0;transition:width .35s ease}
.barra.alerta>div{background:var(--neg)}
.resumo{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:.92rem;color:var(--muted)}
.resumo b{color:var(--ink);font-weight:600}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1 1 140px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 16px;cursor:pointer}
button.primario{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.perigo{color:var(--neg);border-color:var(--neg)}
button.mini{padding:6px 10px;font-size:.85rem}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form-grid .desc{grid-column:1/-1}
.acoes{display:flex;gap:8px;margin-top:12px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .nome{font-weight:600}
.item .meta{color:var(--muted);font-size:.85rem}
.item .preco{font-weight:600;text-align:right;color:var(--neg)}
.item .botoes{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.item.editando{background:var(--sand);margin:0 -10px;padding:12px 10px;border-radius:8px}
.vazio{color:var(--muted);padding:8px 0}
.erro{color:var(--neg);font-size:.88rem;margin-top:8px;min-height:1.2em}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
[hidden]{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
#login .card{width:100%;max-width:380px;margin:0}
#login h1{color:var(--ink);font-size:1.3rem;font-weight:800;margin-bottom:4px}
#login p{color:var(--muted);margin:0 0 14px;font-size:.92rem}
#login label{margin-bottom:12px}
#login button{width:100%}
.topo .quem{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.barra>div{transition:none}}
</style>
</head>
<body>
<section id="login">
  <div class="card">
    <h1>Controle financeiro familiar</h1>
    <p>Entre com seu usuário e senha.</p>
    <label>Usuário
      <input id="lUser" type="text" autocomplete="username" autocapitalize="none">
    </label>
    <label>Senha
      <input id="lPass" type="password" autocomplete="current-password">
    </label>
    <button class="primario" id="btnEntrar" type="button">Entrar</button>
    <div class="erro" id="lErro" role="alert"></div>
  </div>
</section>

<main id="app" hidden>
  <div class="topo"><h1>Controle financeiro familiar</h1>
    <div class="quem"><span id="quem"></span><button class="mini" id="btnSair" type="button">Sair</button></div>
  </div>

  <section class="card saldo" aria-live="polite">
    <div class="label">Saldo disponível</div>
    <div class="valor" id="saldo">R$ 0,00</div>
    <div class="barra" id="barra"><div></div></div>
    <div class="resumo">
      <span>Montante: <b id="rMontante">R$ 0,00</b></span>
      <span>Gasto: <b id="rGasto">R$ 0,00</b> (<b id="rPct">0%</b>)</span>
    </div>
  </section>

  <section class="card">
    <h2>Montante geral</h2>
    <div class="linha">
      <label>Valor total disponível (R$)
        <input id="montante" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Ex.: 5000,00">
      </label>
      <button class="primario" id="btnMontante" type="button">Salvar montante</button>
    </div>
  </section>

  <section class="card">
    <h2 id="tituloForm">Novo gasto</h2>
    <div class="form-grid">
      <label class="desc">Descrição
        <input id="desc" type="text" maxlength="80" placeholder="Ex.: Supermercado">
      </label>
      <label>Valor (R$)
        <input id="valor" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00">
      </label>
      <label>Categoria
        <select id="cat">
          <option>Alimentação</option><option>Moradia</option><option>Transporte</option>
          <option>Saúde</option><option>Educação</option><option>Lazer</option>
          <option>Contas</option><option>Outros</option>
        </select>
      </label>
      <label>Data
        <input id="data" type="date">
      </label>
    </div>
    <div class="acoes">
      <button class="primario" id="btnSalvar" type="button">Adicionar gasto</button>
      <button id="btnCancelar" type="button" hidden>Cancelar edição</button>
    </div>
    <div class="erro" id="erro" role="alert"></div>
  </section>

  <section class="card">
    <h2>Gastos lançados</h2>
    <div id="lista"></div>
  </section>
</main>

<script>
(function(){
  var KEY = "controleFinanceiroFamiliar.v1";
  var estado = { montante: 0, gastos: [] };
  var editandoId = null;
  var confirmandoId = null;

  var $ = function(id){ return document.getElementById(id); };
  var brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

  function carregar(){
    try {
      var bruto = localStorage.getItem(KEY);
      if (bruto) {
        var d = JSON.parse(bruto);
        if (d && typeof d.montante === "number" && Array.isArray(d.gastos)) estado = d;
      }
    } catch(e) {}
  }
  function salvar(){
    try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch(e) {}
  }
  function hoje(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var dia = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+dia;
  }
  function fmtData(iso){
    if (!iso) return "";
    var p = iso.split("-");
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function total(){
    return estado.gastos.reduce(function(s,g){ return s + g.valor; }, 0);
  }
  function esc(t){
    var d = document.createElement("div"); d.textContent = t; return d.innerHTML;
  }

  function render(){
    var gasto = total();
    var saldo = estado.montante - gasto;
    var pct = estado.montante > 0 ? Math.min(100, Math.round(gasto / estado.montante * 100)) : (gasto > 0 ? 100 : 0);

    $("saldo").textContent = brl.format(saldo);
    $("saldo").classList.toggle("neg", saldo < 0);
    $("rMontante").textContent = brl.format(estado.montante);
    $("rGasto").textContent = brl.format(gasto);
    $("rPct").textContent = pct + "%";
    $("barra").firstElementChild.style.width = pct + "%";
    $("barra").classList.toggle("alerta", saldo < 0 || pct >= 90);

    var ordenados = estado.gastos.slice().sort(function(a,b){
      return (b.data || "").localeCompare(a.data || "") || b.id - a.id;
    });
    var html = "";
    if (!ordenados.length) {
      html = '<div class="vazio">Nenhum gasto lançado ainda. Preencha o formulário acima para começar.</div>';
    }
    ordenados.forEach(function(g){
      var confirmando = confirmandoId === g.id;
      html += '<div class="item' + (editandoId === g.id ? ' editando' : '') + '">' +
        '<div><div class="nome">' + esc(g.desc) + '</div>' +
        '<div class="meta">' + esc(g.cat) + ' • ' + fmtData(g.data) + '</div></div>' +
        '<div class="preco">− ' + brl.format(g.valor) + '</div>' +
        '<div class="botoes">' +
          '<button class="mini" data-acao="editar" data-id="' + g.id + '" type="button">Editar</button>' +
          '<button class="mini perigo" data-acao="excluir" data-id="' + g.id + '" type="button">' +
            (confirmando ? 'Confirmar exclusão' : 'Excluir') + '</button>' +
        '</div></div>';
    });
    $("lista").innerHTML = html;
  }

  function limparForm(){
    editandoId = null;
    $("desc").value = ""; $("valor").value = "";
    $("cat").selectedIndex = 0; $("data").value = hoje();
    $("tituloForm").textContent = "Novo gasto";
    $("btnSalvar").textContent = "Adicionar gasto";
    $("btnCancelar").hidden = true;
    $("erro").textContent = "";
  }

  $("btnMontante").addEventListener("click", function(){
    var v = parseFloat($("montante").value);
    if (isNaN(v) || v < 0) { $("erro").textContent = "Informe um montante válido (zero ou maior)."; return; }
    estado.montante = Math.round(v * 100) / 100;
    $("erro").textContent = "";
    salvar(); render();
  });

  $("btnSalvar").addEventListener("click", function(){
    var desc = $("desc").value.trim();
    var valor = parseFloat($("valor").value);
    if (!desc) { $("erro").textContent = "Escreva uma descrição para o gasto."; $("desc").focus(); return; }
    if (isNaN(valor) || valor <= 0) { $("erro").textContent = "Informe um valor maior que zero."; $("valor").focus(); return; }
    valor = Math.round(valor * 100) / 100;
    var dados = { desc: desc, valor: valor, cat: $("cat").value, data: $("data").value || hoje() };
    if (editandoId !== null) {
      estado.gastos.forEach(function(g){ if (g.id === editandoId) { g.desc = dados.desc; g.valor = dados.valor; g.cat = dados.cat; g.data = dados.data; } });
    } else {
      dados.id = Date.now();
      estado.gastos.push(dados);
    }
    salvar(); limparForm(); render();
  });

  $("btnCancelar").addEventListener("click", function(){ limparForm(); render(); });

  $("lista").addEventListener("click", function(e){
    var b = e.target.closest("button[data-acao]");
    if (!b) return;
    var id = Number(b.getAttribute("data-id"));
    if (b.getAttribute("data-acao") === "editar") {
      var g = estado.gastos.filter(function(x){ return x.id === id; })[0];
      if (!g) return;
      editandoId = id; confirmandoId = null;
      $("desc").value = g.desc; $("valor").value = g.valor;
      $("cat").value = g.cat; $("data").value = g.data;
      $("tituloForm").textContent = "Editar gasto";
      $("btnSalvar").textContent = "Salvar alterações";
      $("btnCancelar").hidden = false;
      $("erro").textContent = "";
      render();
      $("desc").scrollIntoView({ behavior: "smooth", block: "center" });
      $("desc").focus();
    } else {
      if (confirmandoId === id) {
        estado.gastos = estado.gastos.filter(function(x){ return x.id !== id; });
        confirmandoId = null;
        if (editandoId === id) limparForm();
        salvar();
      } else {
        confirmandoId = id;
      }
      render();
    }
  });

  document.addEventListener("click", function(e){
    if (confirmandoId !== null && !e.target.closest('button[data-acao="excluir"]')) { confirmandoId = null; render(); }
  });

  // ---- Acesso (usuário e senha) ----
  var USUARIOS = {
    "arthur": { nome: "Arthur", hash: "a14750e98c9a752318f44427dcbd0181c81b83d49cce61448a9dbfd891bc0a32" },
    "thamires": { nome: "Thamires", hash: "2c0a27c7be711c71d28c3849530b6741e3dfa5d670182882b0b9b784e91adea4" }
  };
  var SESSAO = "controleFinanceiroFamiliar.sessao";

  function sha256(texto){
    var bytes = new TextEncoder().encode(texto);
    return crypto.subtle.digest("SHA-256", bytes).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }
  function mostrarApp(chave){
    $("quem").textContent = USUARIOS[chave].nome;
    $("login").hidden = true;
    $("app").hidden = false;
  }
  function mostrarLogin(){
    $("app").hidden = true;
    $("login").hidden = false;
    $("lPass").value = "";
    $("lUser").focus();
  }
  function entrar(){
    var chave = $("lUser").value.trim().toLowerCase();
    var senha = $("lPass").value;
    var u = USUARIOS[chave];
    if (!u || !window.crypto || !crypto.subtle) { $("lErro").textContent = "Usuário ou senha incorretos."; return; }
    sha256(chave + ":" + senha).then(function(h){
      if (h === u.hash) {
        try { sessionStorage.setItem(SESSAO, chave); } catch(e) {}
        $("lErro").textContent = "";
        mostrarApp(chave);
      } else {
        $("lErro").textContent = "Usuário ou senha incorretos.";
      }
    });
  }
  $("btnEntrar").addEventListener("click", entrar);
  $("lPass").addEventListener("keydown", function(e){ if (e.key === "Enter") entrar(); });
  $("lUser").addEventListener("keydown", function(e){ if (e.key === "Enter") $("lPass").focus(); });
  $("btnSair").addEventListener("click", function(){
    try { sessionStorage.removeItem(SESSAO); } catch(e) {}
    mostrarLogin();
  });
  var ativa = null;
  try { ativa = sessionStorage.getItem(SESSAO); } catch(e) {}
  if (ativa && USUARIOS[ativa]) mostrarApp(ativa); else mostrarLogin();

  carregar();
  $("montante").value = estado.montante || "";
  limparForm();
  render();
})();
</script>
</body>
</html>
